name: Update README Stats & Contribution Graph

on:
  schedule:
    - cron: "0 3 * * *"   # regenerate daily at 3am UTC
  workflow_dispatch: {}     # allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        run: node .github/scripts/generate-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: aayushg2006

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats and contribution graph" || exit 0
          git push
